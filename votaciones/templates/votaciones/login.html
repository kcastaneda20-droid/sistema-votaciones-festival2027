{% extends "votaciones/base.html" %}

{% block titulo %}Iniciar sesión{% endblock %}

{% block contenido %}
    <div class="caja tarjeta">
        <h1>Iniciar sesión</h1>
        <p class="subtitulo">Festival de la Leyenda Vallenata 2027</p>

        <form method="post" class="formulario">
            {% csrf_token %}
            {{ formulario.as_p }}
            <button class="boton boton-bloque" type="submit">Ingresar</button>
        </form>

        <p>¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate aquí</a></p>
        <p><a href="{% url 'inicio' %}">Volver al inicio</a></p>
    </div>
{% endblock %}
