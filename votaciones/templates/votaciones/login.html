
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Festival Vallenato 2027</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f3;
            margin: 0;
            padding: 30px 15px;
        }

        .contenedor {
            max-width: 450px;
            margin: 30px auto;
            padding: 28px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000015;
        }

        h1 {
            color: #176b3a;
            text-align: center;
        }

        button {
            width: 100%;
            background: #176b3a;
            color: white;
            border: 0;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        a {
            color: #176b3a;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>Iniciar sesión</h1>
        <p>Festival de la Leyenda Vallenata 2027</p>

        <form method="post">
            {% csrf_token %}
            {{ formulario.as_p }}
            <button type="submit">Ingresar</button>
        </form>

        <p>¿No tienes cuenta?
            <a href="{% url 'registro' %}">Regístrate aquí</a>
        </p>

        <p><a href="{% url 'inicio' %}">Volver al inicio</a></p>
    </div>
</body>
</html>
