{% extends "votaciones/base.html" %}

{% block titulo %}Crear cuenta{% endblock %}

{% block contenido %}
    <div class="caja tarjeta">
        <h1>Crear cuenta</h1>
        <p class="subtitulo">Festival de la Leyenda Vallenata 2027</p>

        <form method="post" class="formulario">
            {% csrf_token %}
            {{ formulario.as_p }}
            <button class="boton boton-bloque" type="submit">Registrarme</button>
        </form>

        <p>¿Ya tienes una cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
        <p><a href="{% url 'inicio' %}">Volver al inicio</a></p>
    </div>
{% endblock %}
